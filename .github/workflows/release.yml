name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test the tagged version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag is the crate version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c "import json, sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml."
            exit 1
          fi
      - name: Test
        run: cargo test --release --verbose
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # The version must say a break when the API breaks, against the last version on crates.io.
      - name: Semver
        run: cargo semver-checks

  crates:
    name: Upload to crates.io
    needs: test
    # glasskit builds only on Windows, and cargo publish builds the crate before it uploads.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github:
    name: Publish the GitHub release
    # Only after crates.io has the version, so a release never names a version that is not there.
    needs: crates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release 🚀
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
