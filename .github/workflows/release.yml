name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Test and draft the GitHub release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag is the crate version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c "import json, sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml."
            exit 1
          fi
      - name: Test
        run: cargo test --release --verbose
      - name: Release 🚀
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true

  crates:
    name: Upload to crates.io
    needs: release
    # glasskit builds only on Windows, and cargo publish builds the crate before it uploads.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
